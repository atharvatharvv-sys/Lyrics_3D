name: Build Lyrics3D LeviPack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Configure & Build Android arm64-v8a
        run: |
          xmake f -p android -a arm64-v8a --ndk="$ANDROID_NDK_LATEST_HOME" --ndk_sdkver=26 -m release -y
          xmake -y

      - name: Upload lyrics3d.levipack
        uses: actions/upload-artifact@v4
        with:
          name: lyrics3d-levipack
          path: build/android/arm64-v8a/release/lyrics3d.levipack
